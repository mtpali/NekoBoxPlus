name: Build native core
on:
  push:
    branches: [main, fix/notification-expiry-qr-widget]
    paths:
      - UPSTREAM_COMMIT
      - upstream
      - scripts/build-native.sh
      - scripts/prepare-native.py
      - scripts/native-source-id.py
      - patches/native.patch
      - native-overlay/**
      - .github/workflows/native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Reclaim space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
          link-to-sdk: true
      - name: Install platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: actions/cache/restore@v4
        id: cache
        with:
          key: native-toolchain-${{ runner.os }}-7e662032-v1
          path: |
            .cache/native-toolchain.tar.zst
            upstream/workspace/NekoBoxForAndroid/.cache/docker-go-mod
            upstream/workspace/NekoBoxForAndroid/.cache/docker-go-build
            upstream/workspace/sing-box/common/adblock/bridge/target
      - name: Identify native source
        id: native_id
        run: echo "artifact_name=$(python3 scripts/native-source-id.py)" >> "$GITHUB_OUTPUT"
      - name: Build core and per-app counters for ARMv7 and ARM64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-native.sh
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('.cache/native-toolchain.tar.zst') != ''
        with:
          key: native-toolchain-${{ runner.os }}-7e662032-v1
          path: |
            .cache/native-toolchain.tar.zst
            upstream/workspace/NekoBoxForAndroid/.cache/docker-go-mod
            upstream/workspace/NekoBoxForAndroid/.cache/docker-go-build
            upstream/workspace/sing-box/common/adblock/bridge/target
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.native_id.outputs.artifact_name }}
          path: dist/native/
          retention-days: 90
